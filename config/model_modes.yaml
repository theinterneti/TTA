# config/model_modes.yaml — tier-based routing for ModelRouterPrimitive
#
# This file mirrors src/components/model_management/model_modes.yaml and is
# read by scripts/simulate_run.py via ModeRunner.
#
# Tier order: local Ollama → Groq (fast) → pinned free OpenRouter → FreeModelTracker auto
#
# Tier semantics:
#   provider: ollama      — local Ollama (requires model:, uses OLLAMA_URL env or localhost)
#   provider: groq        — Groq cloud, fast inference (GROQ_API_KEY)
#   provider: openrouter  — pinned OpenRouter model (OPENROUTER_API_KEY)
#   provider: auto        — FreeModelTracker selects best available free OpenRouter model

modes:
  narration:
    description: "Generate narrative prose for the therapeutic text adventure"
    tier1:
      provider: groq
      model: "llama-3.3-70b-versatile"
      params:
        temperature: 0.8
        max_tokens: 512
    tier2:
      provider: openrouter
      model: "nousresearch/hermes-3-llama-3.1-405b:free"
      params:
        temperature: 0.8
        max_tokens: 512
    tier3:
      provider: auto
      params:
        temperature: 0.8
        max_tokens: 512

  extraction:
    description: "Extract structured [STATE]...[/STATE] blocks from narrative"
    tier1:
      provider: ollama
      model: "tta-extractor-qwen3"
      params:
        temperature: 0.0
        top_k: 1
        num_predict: 128
    tier2:
      provider: groq
      model: "llama-3.1-8b-instant"
      params:
        temperature: 0.0
        max_tokens: 128
    tier3:
      provider: openrouter
      model: "meta-llama/llama-3.2-3b-instruct:free"
      params:
        temperature: 0.0
        max_tokens: 128
    tier4:
      provider: auto
      params:
        temperature: 0.0
        max_tokens: 128

  crisis_detection:
    description: "Classify player input for crisis/safety signals"
    tier1:
      provider: groq
      model: "llama-3.3-70b-versatile"
      params:
        temperature: 0.0
        max_tokens: 64
    tier2:
      provider: openrouter
      model: "meta-llama/llama-3.3-70b-instruct:free"
      params:
        temperature: 0.0
        max_tokens: 64
    tier3:
      provider: auto
      params:
        temperature: 0.0
        max_tokens: 64

