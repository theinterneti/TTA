            - name: AI Issue Manager
  # You may pin to the exact commit or the version.
  # uses: xuezhaojun/ai-issue-manager@d12438e724c7a105c3776cd67099949dde3b72cd
  uses: xuezhaojun/ai-issue-manager@v1.0.0
  with:
    # OpenAI(or any compatible LLM provider) API key
    openai_api_key: 
    # OpenAI(or any compatible LLM provider) API URL
    openai_api_url: 
    # GitHub token for API access
    github_token: # default is ${{ github.token }}
    # OpenAI(or any compatible LLM provider) model to use
    model: 
    # The condition will be used to determine if the action should be taken
    condition: 
    # Actions to take on the issue (comment/close/label_add/label_remove), example: "comment,label_add"
    actions: 
    # Comment content when action_type is comment
    action_comment: # optional
    # Labels to add/remove when action_type is label_add or label_remove (comma-separated)
    action_labels: # optional
          
