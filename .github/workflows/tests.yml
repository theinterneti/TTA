name: Tests

on:
  push:
    branches:
      - main
      - staging
      - development
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - staging
      - development

# Cancel in-progress runs for the same PR/branch to save CI costs
concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (split ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync

      - name: Run unit tests
        run: |
          uv run pytest -q --tb=short \
            -m "not integration and not neo4j and not redis" \
            --ignore=tests/post_deployment \
            --ignore=tests/e2e \
            --ignore=tests/e2e-staging \
            --ignore=tests/comprehensive_battery \
            --ignore=tests/agent_orchestration \
            --ignore=tests/integration \
            --ignore=tests/performance \
            --ignore=tests/contract \
            --ignore=tests/contracts \
            -n auto \
            --splitting-algorithm=least_duration \
            --group=${{ matrix.group }} \
            --splits=3 \
            --junitxml=test-results/unit-tests.xml \
            --cov=src --cov-branch \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            tests/unit/ \
            tests/monitoring/ \
            tests/security/ \
            tests/player_experience/ \
            tests/common/

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-unit.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results-${{ matrix.group }}
          path: |
            test-results/
            coverage-unit.xml

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref != 'refs/heads/development'
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
        ports:
          - 7687:7687
        options: >-
          --health-cmd="/var/lib/neo4j/bin/cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      RUN_NEO4J_TESTS: "1"
      RUN_REDIS_TESTS: "1"
      TEST_NEO4J_URI: "bolt://localhost:7687"
      TEST_NEO4J_USERNAME: "neo4j"
      TEST_NEO4J_PASSWORD: "testpassword"
      TEST_REDIS_URI: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync

      - name: Run integration tests
        run: |
          uv run pytest -q --tb=short \
            -m "integration or neo4j or redis" \
            --junitxml=test-results/integration-tests.xml \
            --cov=src --cov-branch \
            --cov-report=xml:coverage-integration.xml \
            tests/
        continue-on-error: true  # pre-existing integration test failures; tracked separately

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: |
            test-results/
            coverage-integration.xml
