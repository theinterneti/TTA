# TTA Model Mode Configuration
# Controls which model/params are used for each role at runtime.
# Tier 1 = local (fast, always available)
# Tier 2 = pinned free OR model (1-3s, predictable)  
# Tier 3 = openrouter/free catch-all (last resort)

modes:
  narration:
    description: "Generate narrative prose — story beats, NPC dialogue, scene descriptions"
    tier1:
      model: null  # No fine-tuned narration model yet
    tier2:
      model: "nousresearch/hermes-3-llama-3.1-405b:free"
      params:
        temperature: 0.8
        max_tokens: 512
        top_p: 0.95
    tier2_alt:
      - "qwen/qwen3.6-plus-preview:free"          # 1M ctx, great for long narrative
      - "nvidia/nemotron-3-super-120b-a12b:free"  # 120B, high quality
      - "meta-llama/llama-3.3-70b-instruct:free"  # reliable 70B
    tier3:
      model: "openrouter/free"
      params:
        temperature: 0.8
        max_tokens: 512

  extraction:
    description: "Extract structured [STATE]...[/STATE] from narrative text"
    tier1:
      model: "tta-extractor-qwen3"  # Local Ollama model (post fine-tune)
      params:
        temperature: 0.0
        top_k: 1
        num_predict: 128
    tier2:
      model: "qwen/qwen3.6-plus-preview:free"   # Qwen family, best at structured output
      params:
        temperature: 0.0
        max_tokens: 128
    tier2_alt:
      - "nvidia/nemotron-nano-9b-v2:free"
      - "meta-llama/llama-3.3-70b-instruct:free"
    tier3:
      model: "openrouter/free"
      params:
        temperature: 0.0
        max_tokens: 128

  crisis_detection:
    description: "Classify player input for crisis/safety signals"
    tier1:
      model: null  # Use rule-based fast-path (no LLM needed for high-confidence)
    tier2:
      model: "meta-llama/llama-3.3-70b-instruct:free"
      params:
        temperature: 0.0
        max_tokens: 64
    tier3:
      model: "openrouter/free"
      params:
        temperature: 0.0
        max_tokens: 64
