# model_modes.yaml — migrated to explicit provider format for TTA.dev ModelRouterPrimitive
#
# Migration notes (old → new)
# ────────────────────────────
# Old format: tier number implied provider (1=ollama, 2=openrouter-pinned,
#             3=openrouter/free catch-all).  Null model in tier1 caused that
#             tier to be skipped at runtime via an if-None guard in ModeRunner.
#
# New format: explicit `provider:` key on every tier; null/skipped tiers are
#             simply omitted.  `provider: auto` lets FreeModelTracker pick the
#             best available free OpenRouter model dynamically.
#
# Tier semantics:
#   provider: ollama      — local Ollama (requires model:)
#   provider: groq        — Groq API (fast inference, GROQ_API_KEY)
#   provider: openrouter  — pinned OpenRouter model (requires model:)
#   provider: auto        — FreeModelTracker → best free OpenRouter model

modes:
  narration:
    description: "Generate narrative prose — story beats, NPC dialogue, scene descriptions"
    # Tier order: Groq (fast, stable free) → pinned OR model → FreeModelTracker auto
    # FreeModelTracker (tier3) fetches the live free model list from OpenRouter and
    # ranks by quality, so it naturally picks up whatever free Gemini/Llama/etc. is
    # currently available — no need to hardcode volatile model slugs here.
    # When a local narration model exists, add: tier0: provider: ollama, model: <id>
    tier1:
      provider: groq
      model: "llama-3.3-70b-versatile"
      params:
        temperature: 0.8
        max_tokens: 512
    tier2:
      provider: openrouter
      model: "nousresearch/hermes-3-llama-3.1-405b:free"
      params:
        temperature: 0.8
        max_tokens: 512
        top_p: 0.95
    tier3:
      provider: auto
      params:
        temperature: 0.8
        max_tokens: 512

  extraction:
    description: "Extract structured [STATE]...[/STATE] from narrative text"
    tier1:
      provider: ollama
      model: "tta-extractor-qwen3"
      params:
        temperature: 0.0
        top_k: 1
        num_predict: 128
    tier2:
      provider: groq
      model: "llama-3.1-8b-instant"
      params:
        temperature: 0.0
        max_tokens: 128
    tier3:
      provider: openrouter
      model: "meta-llama/llama-3.2-3b-instruct:free"
      params:
        temperature: 0.0
        max_tokens: 128
    tier4:
      provider: auto
      params:
        temperature: 0.0
        max_tokens: 128

  crisis_detection:
    description: "Classify player input for crisis/safety signals"
    # Priority: Groq (fast, deterministic) → pinned free cloud → FreeModelTracker
    tier1:
      provider: groq
      model: "llama-3.3-70b-versatile"
      params:
        temperature: 0.0
        max_tokens: 64
    tier2:
      provider: openrouter
      model: "meta-llama/llama-3.3-70b-instruct:free"
      params:
        temperature: 0.0
        max_tokens: 64
    tier3:
      provider: auto
      params:
        temperature: 0.0
        max_tokens: 64

