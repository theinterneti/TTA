# model_modes.yaml — migrated to explicit provider format for TTA.dev ModelRouterPrimitive
#
# Migration notes (old → new)
# ────────────────────────────
# Old format: tier number implied provider (1=ollama, 2=openrouter-pinned,
#             3=openrouter/free catch-all).  Null model in tier1 caused that
#             tier to be skipped at runtime via an if-None guard in ModeRunner.
#
# New format: explicit `provider:` key on every tier; null/skipped tiers are
#             simply omitted.  `provider: auto` lets FreeModelTracker pick the
#             best available free OpenRouter model dynamically.
#
# Tier semantics:
#   provider: ollama      — local Ollama (requires model:)
#   provider: groq        — Groq API (fast inference, GROQ_API_KEY)
#   provider: openrouter  — pinned OpenRouter model (requires model:)
#   provider: auto        — FreeModelTracker → best free OpenRouter model

modes:
  narration:
    description: "Generate narrative prose — story beats, NPC dialogue, scene descriptions"
    # Rotation cascade — each Groq model has its own independent quota bucket, so
    # exhausting one tier (429) falls through to the next with fresh capacity.
    # Effective narration budget: ~63 cloud turns/min across all Groq tiers alone.
    #
    # Tier order (quality + quota diversity):
    #   tier1–tier2: Primary Groq 70B-class models  (6K TPM each, ~7 turns/min each)
    #   tier3:       Gemini 2.0 Flash               (1M TPM, 15 RPM — when available)
    #   tier4:       Groq 120B GPT-OSS              (6K TPM, separate bucket)
    #   tier5:       Groq Llama 4 Scout 17B         (separate bucket, good quality)
    #   tier6:       Groq 8B fallback               (30K TPM — rarely exhausted)
    #   tier7–tier8: Pinned OpenRouter free models  (variable availability)
    #   tier9:       FreeModelTracker auto-pick      (dynamic best-available)
    #   (final):     Local Ollama — wired in simulate_run.py / play.py
    #
    # Skip qwen/qwen3-32b here — it emits <think>…</think> blocks by default
    # (thinking mode) which break narrative output format.
    tier1:
      provider: groq
      model: "llama-3.3-70b-versatile"
      params:
        temperature: 0.8
        max_tokens: 512
    tier2:
      provider: groq
      model: "moonshotai/kimi-k2-instruct"
      params:
        temperature: 0.8
        max_tokens: 512
    tier3:
      provider: gemini
      model: "gemini-2.0-flash"
      params:
        temperature: 0.8
        max_tokens: 512
    tier4:
      provider: groq
      model: "openai/gpt-oss-120b"
      params:
        temperature: 0.8
        max_tokens: 512
    tier5:
      provider: groq
      model: "meta-llama/llama-4-scout-17b-16e-instruct"
      params:
        temperature: 0.8
        max_tokens: 512
    tier6:
      provider: groq
      model: "llama-3.1-8b-instant"
      params:
        temperature: 0.8
        max_tokens: 512
    tier7:
      provider: openrouter
      model: "nousresearch/hermes-3-llama-3.1-405b:free"
      params:
        temperature: 0.8
        max_tokens: 512
        top_p: 0.95
    tier8:
      provider: openrouter
      model: "meta-llama/llama-3.3-70b-instruct:free"
      params:
        temperature: 0.8
        max_tokens: 512
    tier9:
      provider: auto
      params:
        temperature: 0.8
        max_tokens: 512

  extraction:
    description: "Extract structured [STATE]...[/STATE] from narrative text"
    tier1:
      provider: ollama
      model: "tta-extractor-qwen3"
      params:
        temperature: 0.0
        top_k: 1
        num_predict: 128
    tier2:
      provider: groq
      model: "llama-3.1-8b-instant"
      params:
        temperature: 0.0
        max_tokens: 128
    tier3:
      provider: openrouter
      model: "meta-llama/llama-3.2-3b-instruct:free"
      params:
        temperature: 0.0
        max_tokens: 128
    tier4:
      provider: auto
      params:
        temperature: 0.0
        max_tokens: 128

  crisis_detection:
    description: "Classify player input for crisis/safety signals"
    # Priority: Groq (fast, deterministic) → pinned free cloud → FreeModelTracker
    tier1:
      provider: groq
      model: "llama-3.3-70b-versatile"
      params:
        temperature: 0.0
        max_tokens: 64
    tier2:
      provider: openrouter
      model: "meta-llama/llama-3.3-70b-instruct:free"
      params:
        temperature: 0.0
        max_tokens: 64
    tier3:
      provider: auto
      params:
        temperature: 0.0
        max_tokens: 64

